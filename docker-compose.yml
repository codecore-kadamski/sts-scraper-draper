version: '3.7'

networks:
  default_net:

volumes:
  data:
  data_mysql:

services:
  pgsql:
    container_name: pgsqldb
    image: postgres:11.3-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=stsparser
      - POSTGRES_USER=stsparser
      - POSTGRES_DB=stsparser
      - POSTGRES_HOST=127.0.0.1
      - PG_TRUST_LOCALNET=true
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      default_net:

  mysql:
    container_name: mysqldb
    image: mysql:5.7.17
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=stsparser
      - MYSQL_PASS=stsparser
      - MYSQL_USER=stsparser
      - MYSQL_DATABASE=stsparser
      - MYSQL_HOST=127.0.0.1
    #user: "1000:50"
    command: --innodb-flush-method=O_DSYNC --innodb-use-native-aio=0 --log_bin=ON --server-id=master-01 --innodb_buffer_pool_size=20M
    volumes:
      - ./data_mysql:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      #- ./mysqld_innodb.cnf:/etc/mysql/conf.d/mysqld_innodb.cnf
      #- ./initdb:/docker-entrypoint-initdb.d/
    networks:
      default_net:
    healthcheck:
        test: "test -f /var/lib/mysql/loaded"

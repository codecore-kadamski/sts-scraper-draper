  mysql:
    container_name: mysql
    image: mysql:5.7.17
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_PASSWORD=stsparser
      - MYSQL_USER=stsparser
      - MYSQL_DATABASE=stsparser
      - MYSQL_ROOT_HOST=%
      - TZ=Europe/Warsaw
    #user: "1000:50"
    command: --innodb-flush-method=O_DSYNC --innodb-use-native-aio=0 --log_bin=ON --server-id=master-01 --innodb_buffer_pool_size=20M
    volumes:
      - ./data_mysql:/var/lib/mysql
      - ./scripts/mysql:/docker-entrypoint-initdb.d
    networks:
      default_net:
    healthcheck:
        test: "test -f /var/lib/mysql/loaded"

  redis:
    container_name: redis
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      default_net:

  rabbit:
    container_name: rabbit
    hostname: rabbit
    image: rabbitmq:latest
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=pass
    ports:
        - "5672:5672"
    networks:
      default_net:


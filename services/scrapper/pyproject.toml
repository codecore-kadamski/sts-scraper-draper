[tool.black]
line-length = 128
target-version = ['py36']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length=128

[tool.poetry]
name = "scrapper"
version = "0.1.0"
description = ""
authors = ["kadam <kadam@softserveinc.com>"]

[tool.poetry.dependencies]
python = "^3.6"
dynaconf = "^2.1"
bs4 = "^0.0.1"
selenium = "^3.141"
requests = "^2.22"
celery = "^4.3.0"
redis = "^3.2.1"
pydantic = "^1.0"
sqlalchemy = "^1.3"
pyMySQL = "^0.9.3"
kombu = "4.6.3"

[tool.poetry.dev-dependencies]
pytest = "^3.0"
ipython = "^7.8"
ipdb = "^0.12.2"
flower = "^0.9.3"
wdb = "^3.3"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

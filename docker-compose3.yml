version: '3.7'

services:
  mysql:
    container_name: mysql
    image: mysql:5.7.17
    restart: always
    ports:
      - 3306:3306
    env_file:
      - ./conf/.env
    command: --innodb-flush-method=O_DSYNC --innodb-use-native-aio=0 --log_bin=ON --server-id=master-01 --innodb_buffer_pool_size=20M
    volumes:
      - ./data_mysql:/var/lib/mysql
      - ./scripts/mysql:/docker-entrypoint-initdb.d
    networks:
      default_net:
        ipv4_address: 172.23.0.2
    healthcheck:
      test: "test -f /var/lib/mysql/loaded"

  chromedriver:
    build:
      context: ./services/chromedriver
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./conf/.env
    environment:
      - DEVELOP=true
    container_name: chromedriver
    #  image: chromedriver:latest
    ports:
      - 4444:4444
    networks:
      default_net:
        ipv4_address: 172.23.0.10

  wdb:
    container_name: wdb
    #image: kozea/wdb:latest
    image: yajo/wdb-server:latest
    ports:
      - "1984:1984"
    networks:
      default_net:
        ipv4_address: 172.23.0.11

  redis:
    container_name: redis
    image: redis:alpine
    env_file:
      - ./conf/.env
    ports:
      - 6379:6379
    networks:
      default_net:
        ipv4_address: 172.23.0.12

  build:
    build:
      context: ./services/scrapper
      dockerfile: Dockerfile
      args:
        DEVELOP: 'true'
    image: scrapper:latest
    volumes:
      - ./services/scrapper:/scrapper
    env_file:
      - ./conf/.env

  base: &base
    image: scrapper:latest
    restart: always
    depends_on:
      - build
      - mysql
      - redis
      - wdb
      - chromedriver
    env_file:
      - ./conf/.env

  flower:
    <<: *base
    container_name: flower
    ports:
      - "5555:5555"
    command:  celery flower -A scrapper.scrapper --port=5555 --broker=redis://redis:6379/0 -l info
    networks:
      default_net:
        ipv4_address: 172.23.0.15


version: '3.7'


services:
    
    mysql:
        image: us.gcr.io/sts-scraper-draper/mysql-server:v0.7.0
        container_name: mysql
        env_file:
        - ./config/.env

        environment:
            - MYSQL_ROOT_PASSWORD=root
        restart: always
        ports:
            - 3306:3306
        command: --innodb-flush-method=O_DSYNC --innodb-use-native-aio=0 --log_bin=ON --server-id=master-01 --innodb_buffer_pool_size=20M
        volumes:
            - ./scripts/mysql:/docker-entrypoint-initdb.d
            - ./data_mysql:/var/lib/mysql
        networks:
            default_net:
                ipv4_address: 172.23.0.2
        healthcheck:
            test: "test -f /var/lib/mysql/loaded"
    
    redis:
        image: us.gcr.io/sts-scraper-draper/redis-server:v0.5.0
        container_name: redis
        env_file:
        - ./config/.env

        ports:
            - 6379:6379
        networks:
            - default_net
    
    wdb:
        image: us.gcr.io/sts-scraper-draper/wdb-server:v0.2.0
        container_name: wdb
        env_file:
        - ./config/.env

        networks:
            - default_net
        ports:
           - "1984:1984"

    
    chromedriver:
        image: us.gcr.io/sts-scraper-draper/chromedriver:v1.2.0
        container_name: chromedriver
        env_file:
        - ./config/.env

        ports:
            - 4444:4444
        networks:
            - default_net
    
    scrapper:
        image: us.gcr.io/sts-scraper-draper/scrapper:v0.7.0
        container_name: scrapper
        env_file:
        - ./config/.env

        restart: always
        depends_on:
            - build
            - mysql
            - redis
            - wdb
            - chromedriver
        ports:
            - 8000:8000
        command: python scrapper/run.py
        networks:
            default_net:


volumes:
    data_pgsql:
    data_mysql:

networks:
    default_net:

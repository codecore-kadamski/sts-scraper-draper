version: '3.7'

services:

  # pgsql:
  #   container_name: psql
  #   image: postgres:11.3-alpine
  #   restart: on-failure:3
  #   ports:
  #     - "5432:5432"
  #   env_file:
  #     - ./conf/.env
  #   volumes:
  #     - ./data_pgsql:/var/lib/postgresql/data
  #     - ./scripts/pgsql:/docker-entrypoint-initdb.d
  #   networks:
  #     default_net:

  # rabbit:
  #   container_name: rabbit
  #   hostname: rabbit
  #   image: rabbitmq:latest
  #   env_file:
  #     - ./conf/.env
  #   ports:
  #       - "5672:5672"
  #   networks:
  #     default_net:

  build:
    build:
      context: ./services/scrapper
      dockerfile: Dockerfile
    image: scrapper
    env_file:
      - ./conf/.env

  chromedriver:
    container_name: chromedriver
    image: blueimp/chromedriver:latest
    restart: always
    ports:
      - "4444:4444"
    env_file:
      - ./conf/.env
    networks:
      default_net:
        ipv4_address: 172.23.0.1

  mysql:
    container_name: mysql
    image: mysql:5.7.17
    restart: always
    ports:
      - "3306:3306"
    env_file:
      - ./conf/.env
    command: --innodb-flush-method=O_DSYNC --innodb-use-native-aio=0 --log_bin=ON --server-id=master-01 --innodb_buffer_pool_size=20M
    volumes:
      - ./data_mysql:/var/lib/mysql
      - ./scripts/mysql:/docker-entrypoint-initdb.d
    networks:
      default_net:
        ipv4_address: 172.23.0.2

    healthcheck:
      test: "test -f /var/lib/mysql/loaded"

  redis:
    container_name: redis
    image: redis:alpine
    env_file:
      - ./conf/.env
    ports:
      - "6379:6379"
    networks:
      default_net:
        ipv4_address: 172.23.0.3

  scrapper:
    container_name: scrapper
    image: scrapper:latest
    volumes: 
      - ./services/scrapper:/app
      - ./drivers:/drivers
    depends_on:
      - redis
      - mysql
      - celery
    restart: always
    env_file:
      - ./conf/.env
    command: python app/run.py
    ports:
      - 8000:8000
    networks:
      default_net:
        ipv4_address: 172.23.0.4

  celery:
    container_name: celery
    image: scrapper:latest
    volumes: 
      - ./services/scrapper:/app
    depends_on:
      - redis
      - mysql
      - beat
    restart: always
    env_file:
      - ./conf/.env
    command: celery -A app.tasks worker --loglevel=info
    networks:
      default_net:
        ipv4_address: 172.23.0.5

  beat:
    container_name: beat
    image: scrapper:latest
    volumes: 
      - ./services/scrapper:/app
    depends_on:
      - redis
      - mysql
    restart: always
    env_file:
      - ./conf/.env
    command: celery beat -A app --schedule=/tmp/celerybeat-schedule --loglevel=info
    networks:
      default_net:
        ipv4_address: 172.23.0.6

  flower:
    container_name: flower
    image: scrapper
    ports:
      - 5555:5555
    command:  flower -A app.tasks --port=5555 --broker=redis://redis:6379/0
    depends_on:
      - scrapper
      - redis
    networks:
      default_net:
        ipv4_address: 172.23.0.7

  wdb:
    container_name: wdb
    image: kozea/wdb:latest
    ports:
      - "1984:1984"
    networks:
      default_net:
        ipv4_address: 172.23.0.8

networks:
  default_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16

volumes:
  data_pgsql:
  data_mysql:

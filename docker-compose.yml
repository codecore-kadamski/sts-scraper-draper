version: '3.7'

services:

  build:
    build:
      context: ./services/scrapper
      dockerfile: Dockerfile
    image: scrapper
    env_file:
      - ./conf/.env
    networks:
      default_net:

  base: &base
    image: scrapper:latest
    restart: always
    volumes: 
      - ./services/scrapper:/app
      - ./drivers:/drivers
    depends_on:
      - mysql
      - build
      - redis
      - wdb
      - chromedriver

  chromedriver:
    container_name: chromedriver
    image: blueimp/chromedriver:latest
    restart: always
    ports:
      - "4444:4444"
    env_file:
      - ./conf/.env
    networks:
      default_net:
        ipv4_address: 172.23.0.9

  flower:
    container_name: flower
    image: scrapper:latest
    ports:
      - 5555:5555
    command:  flower -A app.tasks --port=5555 --broker=redis://redis:6379/0
    depends_on:
      - scrapper
      - redis
    networks:
      default_net:
        ipv4_address: 172.23.0.5

  wdb:
    container_name: wdb
    image: kozea/wdb:latest
    ports:
      - "1984:1984"
    networks:
      default_net:
        ipv4_address: 172.23.0.3

  redis:
    container_name: redis
    image: redis:alpine
    env_file:
      - ./conf/.env
    ports:
      - "6379:6379"
    networks:
      default_net:
        ipv4_address: 172.23.0.4

  mysql:
    container_name: mysql
    image: mysql:5.7.17
    restart: always
    ports:
      - "3306:3306"
    env_file:
      - ./conf/.env
    command: --innodb-flush-method=O_DSYNC --innodb-use-native-aio=0 --log_bin=ON --server-id=master-01 --innodb_buffer_pool_size=20M
    volumes:
      - ./data_mysql:/var/lib/mysql
      - ./scripts/mysql:/docker-entrypoint-initdb.d
    networks:
      default_net:
        ipv4_address: 172.23.0.2
    healthcheck:
      test: "test -f /var/lib/mysql/loaded"

  scrapper:
    <<: *base
    container_name: scrapper
    ports:
      - "8000:8000"
    command: python app/run.py
    networks:
      default_net:
        ipv4_address: 172.23.0.6

  celery:
    <<: *base
    container_name: celery
    command: celery -A app.tasks worker --loglevel=info
    networks:
      default_net:
        ipv4_address: 172.23.0.7

  beat:
    <<: *base
    container_name: beat
    command: celery beat -A app --schedule=/tmp/celerybeat-schedule --loglevel=info
    networks:
      default_net:
        ipv4_address: 172.23.0.8

networks:
  default_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16

volumes:
  data_pgsql:
  data_mysql:

version: '3.7'


services:
    mysql:
        container_name: mysql
        image: mysql:5.7.17
        restart: always
        ports:
            - 3306:3306
        environment:
            - MYSQL_ROOT_PASSWORD=root
        env_file:
            - ./conf/.env
        command: --innodb-flush-method=O_DSYNC --innodb-use-native-aio=0 --log_bin=ON --server-id=master-01 --innodb_buffer_pool_size=20M
        volumes:
            - ./scripts/mysql:/docker-entrypoint-initdb.d
            - ./data_mysql:/var/lib/mysql
        networks:
            default_net:
                ipv4_address: 172.23.0.2
        healthcheck:
            test: "test -f /var/lib/mysql/loaded"
    redis:
        image: docker.pkg.github.com/codecore-kadamski/sts-scraper-draper/redis:alpine
        container_name: redis
        env_file:
            - ./conf/.env
        ports:
            - 6379:6379
        networks:
            - default_net
    wdb:
        container_name: wdb
        image: docker.pkg.github.com/codecore-kadamski/sts-scraper-draper/wdb-server:latest
        networks:
            - default_net
        ports:
           - "1984:1984"



volumes:
    data_pgsql:
    data_mysql:

networks:
    default_net:

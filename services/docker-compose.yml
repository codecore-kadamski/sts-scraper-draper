version: '2'

networks:
  default_net:

volumes:
  pgdata:

services:
  postgres:
    image: postgres:11.3-alpine
    container_name: stsdb
    restart: always
    environment:
      - POSTGRES_PASSWORD=stsparser
      - POSTGRES_USER=stsparser
      - POSTGRES_DB=stsparser
      # - POSTGRES_HOST=localhost
      - PG_TRUST_LOCALNET=true
    volumes:
      - ./docker/data/postgres/:/var/lib/postgres/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5432:5432
    networks:
      default_net:
    command: >
      bash -c "psql -U stsparser -d stsparser < /docker-entrypoint-initdb.d/init.sql"


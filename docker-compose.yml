version: '3.7'

networks:
  default_net:

volumes:
  data_pgsql:
  data_mysql:

services:

  pgsql:
    container_name: psql
    image: postgres:11.3-alpine
    restart: on-failure:3
    ports:
      - "5432:5432"
    env_file:
      - ./conf/.env
    volumes:
      - ./data_pgsql:/var/lib/postgresql/data
      - ./scripts/pgsql:/docker-entrypoint-initdb.d
    networks:
      default_net:

  mysql:
    container_name: mysql
    image: mysql:5.7.17
    restart: always
    ports:
      - "3306:3306"
    env_file:
      - ./conf/.env
    command: --innodb-flush-method=O_DSYNC --innodb-use-native-aio=0 --log_bin=ON --server-id=master-01 --innodb_buffer_pool_size=20M
    volumes:
      - ./data_mysql:/var/lib/mysql
      - ./scripts/mysql:/docker-entrypoint-initdb.d
    networks:
      default_net:
    healthcheck:
      test: "test -f /var/lib/mysql/loaded"

  # rabbit:
  #   container_name: rabbit
  #   hostname: rabbit
  #   image: rabbitmq:latest
  #   env_file:
  #     - ./conf/.env
  #   ports:
  #       - "5672:5672"
  #   networks:
  #     default_net:

  redis:
    container_name: redis
    image: redis:alpine
    env_file:
      - ./conf/.env
    ports:
      - "6379:6379"
    networks:
      default_net:

  fetcher:
    container_name: fetcher
    image: fetcher:latest
    #build: ./services/fetcher
      # context: ./app
      # dockerfile: Dockerfile
    volumes: 
      - ./services/fetcher:/app
      #- ./drivers:/drivers
    depends_on:
      # - rabbit
      - redis
      - mysql
    restart: always
    env_file:
      - ./conf/.env
    #command: gunicorn -b 0.0.0.0:8000 app:app
    command: python app/run.py
    ports:
      - 8000:8000
    networks:
      default_net:

  celery:
    container_name: celery
    image: fetcher:latest
    # build:
    #   context: ./services/fetcher/
    #   dockerfile: Dockerfile
    volumes: 
      - ./services/fetcher:/app
    # - ./drivers:/drivers
    depends_on:
      # - rabbit
      - fetcher
      - redis
      - mysql
    restart: always
    #user: "1000:1000"
    env_file:
      - ./conf/.env
    command: celery -A app.tasks worker --loglevel=info
    networks:
      default_net:

  flower:
    container_name: flower
    image: fetcher
    ports:
      - 5555:5555
    command:  flower -A app.tasks --port=5555 --broker=redis://redis:6379/0
    depends_on:
      - fetcher
      - redis
    networks:
      default_net:

  wdb:
    container_name: wdb
    image: kozea/wdb:latest
    networks:
      - default_net
    ports:
      - "1984:1984"
